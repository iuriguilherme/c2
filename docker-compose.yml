services:
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT_EXTERNAL:-6379}:${REDIS_PORT_INTERNAL:-6379}"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

  mongo:
    image: mongo:7.0
    ports:
      - "${MONGO_PORT_EXTERNAL:-27017}:${MONGO_PORT_INTERNAL:-27017}"
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port ${API_PORT_INTERNAL:-8000} --reload
    ports:
      - "${API_PORT_EXTERNAL:-8000}:${API_PORT_INTERNAL:-8000}"
    env_file:
      - shared.env
      - .env
    depends_on:
      - redis
      - mongo
      - ollama
    volumes:
      - .:/app
    working_dir: /app

  web:
    build: .
    command: hypercorn web.main:app --bind 0.0.0.0:${WEB_PORT_INTERNAL:-5000} --reload
    ports:
      - "${WEB_PORT_EXTERNAL:-5000}:${WEB_PORT_INTERNAL:-5000}"
    env_file:
      - shared.env
      - .env
    depends_on:
      - redis
      - mongo
      - ollama
    volumes:
      - .:/app
    working_dir: /app

  engine:
    build: .
    command: python engine.py
    env_file:
      - shared.env
      - .env
    depends_on:
      - redis
      - mongo
      - ollama
    volumes:
      - .:/app
    working_dir: /app

  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_PORT_EXTERNAL:-11434}:${OLLAMA_PORT_INTERNAL:-11434}"
    volumes:
      - ${OLLAMA_MODELS_DIR:-./.ollama/models}:/root/.ollama/models

volumes:
  redis_data:
  mongo_data:
