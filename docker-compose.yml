services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - MONGO_URL=mongodb://mongo:27017
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - redis
      - mongo
      - ollama
    volumes:
      - .:/app
    working_dir: /app

  web:
    build: .
    command: hypercorn web.main:app --bind 0.0.0.0:5000 --reload
    ports:
      - "5000:5000"
    environment:
      - REDIS_URL=redis://redis:6379
      - MONGO_URL=mongodb://mongo:27017
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - redis
      - mongo
      - ollama
    volumes:
      - .:/app
    working_dir: /app

  engine:
    build: .
    command: python engine.py
    environment:
      - REDIS_URL=redis://redis:6379
      - MONGO_URL=mongodb://mongo:27017
      - OLLAMA_BASE_URL=http://ollama:11434
      - INITIAL_ENTITIES=5
      - TICK_INTERVAL_SEC=2.0
      - VOID_WIDTH=1000.0
      - VOID_HEIGHT=1000.0
    depends_on:
      - redis
      - mongo
      - ollama
    volumes:
      - .:/app
    working_dir: /app

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ${OLLAMA_MODELS_DIR:-./ollama_models}:/root/.ollama

volumes:
  redis_data:
  mongo_data:
