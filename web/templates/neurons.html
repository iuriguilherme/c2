<!DOCTYPE html>
<html>
<head>
<title>Neuron Settings - AGI Simulation</title>
<style>
  body { font-family: monospace; background: #0a0a0a; color: #0f0; margin: 0; padding: 20px; }
  table { border-collapse: collapse; width: 100%; margin-top: 10px; }
  th, td { border: 1px solid #1a1a1a; padding: 6px 10px; text-align: left; }
  th { background: #111; }
  h1, h2 { color: #0f0; border-bottom: 1px solid #333; padding-bottom: 5px; }
  .section { margin-top: 40px; border-top: 1px solid #333; padding-top: 20px; }
  input, button, select, textarea { background: #1a1a1a; color: #0f0; border: 1px solid #333; padding: 4px 8px; font-family: monospace; }
  .nav a { color: #0f0; text-decoration: none; border: 1px solid #333; padding: 4px 8px; background: #1a1a1a; }
</style>
</head>
<body>
<div class="nav">
  <a href="/">&larr; Back to Dashboard</a>
  <a href="/settings">LLM Settings</a>
</div>

<h1>Neuron Settings</h1>

<div class="section">
  <h2>Neuron Profiles</h2>
  <table>
    <thead><tr><th>ID</th><th>Name</th><th>Description</th><th>Activation Functions</th><th>Allowed Neurons</th><th>Action</th></tr></thead>
    <tbody id="profiles-tbody"></tbody>
  </table>

  <h3>Add / Update Profile</h3>
  <div style="display: flex; flex-direction: column; gap: 10px; max-width: 600px;">
    <input type="text" id="prof-id" placeholder="Profile ID (e.g. basic-motor)">
    <input type="text" id="prof-name" placeholder="Name">
    <textarea id="prof-desc" placeholder="Description"></textarea>
    <label>Activation Functions (comma separated): <input type="text" id="prof-acts" value="tanh"></label>
    <label>Allowed Neurons (comma separated): <input type="text" id="prof-neurons" placeholder="e.g. proximity,locomotion"></label>
    <button onclick="saveProfile()">Save Profile</button>
  </div>
</div>

<script>
const API_BASE = window.location.origin;

async function loadProfiles() {
  try {
    const res = await fetch(`${API_BASE}/neurons/profiles`);
    const profiles = await res.json();
    const tbody = document.getElementById("profiles-tbody");
    tbody.innerHTML = "";
    profiles.forEach(p => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${p.id}</td>
        <td>${p.name}</td>
        <td>${p.description}</td>
        <td>${p.activation_functions.join(", ")}</td>
        <td>${p.allowed_neurons.join(", ")}</td>
        <td><button onclick="deleteProfile('${p.id}')">Delete</button></td>
      `;
      tbody.appendChild(tr);
    });
  } catch (e) {
    console.error(e);
  }
}

async function saveProfile() {
  const payload = {
    id: document.getElementById("prof-id").value.trim(),
    name: document.getElementById("prof-name").value.trim(),
    description: document.getElementById("prof-desc").value.trim(),
    activation_functions: document.getElementById("prof-acts").value.split(",").map(s => s.trim()).filter(Boolean),
    allowed_neurons: document.getElementById("prof-neurons").value.split(",").map(s => s.trim()).filter(Boolean)
  };
  if (!payload.id) { alert("ID is required"); return; }
  try {
    const res = await fetch(`${API_BASE}/neurons/profiles`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error(await res.text());
    loadProfiles();
  } catch (e) {
    alert("Error saving profile: " + e.message);
  }
}

async function deleteProfile(id) {
  if (!confirm(`Delete profile ${id}?`)) return;
  try {
    const res = await fetch(`${API_BASE}/neurons/profiles/${id}`, { method: "DELETE" });
    if (!res.ok) throw new Error(await res.text());
    loadProfiles();
  } catch (e) {
    alert("Error deleting profile: " + e.message);
  }
}

loadProfiles();
</script>
</body>
</html>
