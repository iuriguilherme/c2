<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGI Simulation</title>
<style>
  body { font-family: monospace; background: #0a0a0a; color: #0f0; margin: 0; padding: 20px; }
  h1 { color: #0f0; font-size: 1.2rem; }
  #tick { font-size: 2rem; color: #0f0; }
  table { border-collapse: collapse; width: 100%; margin-top: 16px; }
  th, td { border: 1px solid #1a1a1a; padding: 6px 10px; text-align: left; }
  th { color: #888; font-weight: normal; }
  td { color: #ccc; }
  .nav { margin-bottom: 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .nav a, .nav button { font-family: monospace; font-size: 1rem; cursor: pointer; color: #0f0; text-decoration: none; border: 1px solid #333; padding: 4px 8px; background: #1a1a1a; }
  .nav a:hover, .nav button:hover { background: #333; }

  .config-panel {
    display: none; border: 1px dashed #333; padding: 10px; margin-bottom: 20px; background: #111;
  }
  .config-panel input { background: #000; color: #0f0; border: 1px solid #333; padding: 4px; margin-right: 10px; }
  .config-panel label { font-size: 0.9rem; color: #888; }

  .layout { display: flex; gap: 20px; }
  .main-content { flex: 1; }
  .side-panel {
    width: 400px;
    border-left: 1px solid #333;
    padding-left: 20px;
    display: none;
    word-break: break-all;
  }
  .side-panel h2 { font-size: 1.1rem; border-bottom: 1px solid #333; padding-bottom: 5px; }
  .side-panel .detail-block { margin-bottom: 10px; }
  .side-panel .detail-block strong { color: #888; display: block; }
  .side-panel pre { background: #111; padding: 10px; border: 1px solid #333; overflow-x: auto; font-size: 0.8rem; margin-top: 4px; white-space: pre-wrap; word-break: break-all; max-height: 400px; }
  .side-panel textarea { width: 100%; box-sizing: border-box; background: #111; color: #ccc; border: 1px solid #333; padding: 10px; font-family: monospace; font-size: 0.85rem; margin-top: 4px; resize: vertical; min-height: 80px; }
  .side-panel button.save-btn { font-family: monospace; font-size: 0.85rem; cursor: pointer; color: #0f0; border: 1px solid #333; padding: 4px 8px; background: #1a1a1a; margin-top: 4px; }
  .side-panel button.save-btn:hover { background: #333; }
  tr { cursor: pointer; }
  tr:hover { background: #111; }

  /* Tabs */
  .tabs { display: flex; gap: 5px; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 5px; margin-top: 15px; }
  .tab-btn { background: #111; border: 1px solid #333; color: #888; padding: 5px 10px; cursor: pointer; font-family: monospace; font-size: 0.8rem; }
  .tab-btn.active { color: #0f0; background: #222; border-color: #555; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* Log Panel */
  .log-panel {
    margin-top: 30px;
    border: 1px solid #333;
    background: #050505;
    display: flex;
    flex-direction: column;
    height: 350px;
  }
  .log-header {
    background: #111;
    padding: 10px 15px;
    border-bottom: 1px solid #333;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .log-header h2 { margin: 0; font-size: 1rem; color: #888; }
  .log-body {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    font-size: 0.85rem;
    display: flex;
    flex-direction: column-reverse;
  }
  .log-entry { margin-bottom: 6px; border-bottom: 1px solid #151515; padding-bottom: 4px; line-height: 1.4; }
  .log-entry .time { color: #555; margin-right: 10px; font-size: 0.75rem; }
  .log-entry .type { margin-right: 10px; font-weight: bold; width: 75px; display: inline-block; font-size: 0.75rem; text-align: center; border-radius: 2px; padding: 1px 3px; }
  .log-entry .source { color: #f0f; cursor: pointer; margin-right: 10px; font-weight: bold; }
  .log-entry .source:hover { text-decoration: underline; }
  .log-entry .msg { color: #ccc; }
  
  .log-entry.birth .type { background: #040; color: #0f0; }
  .log-entry.death .type { background: #400; color: #f00; }
  .log-entry.signal .type { background: #440; color: #ff0; }
  .log-entry.movement .type { background: #222; color: #aaa; }

  .log-controls { display: flex; gap: 10px; align-items: center; }
  .log-controls button { background: #1a1a1a; color: #0f0; border: 1px solid #333; padding: 4px 10px; cursor: pointer; font-size: 0.8rem; font-family: monospace; }
  .log-controls button:hover { background: #333; }
  .log-controls button.active { background: #0f0; color: #000; }
  .log-controls input { background: #000; color: #0f0; border: 1px solid #333; padding: 4px 8px; font-size: 0.8rem; font-family: monospace; width: 150px; }
</style>
</head>
<body>
<div class="nav">
  <a href="/llm-providers">LLM Providers &rarr;</a>
  <a href="/neural">Neural Config &rarr;</a>
  <a href="/prompts">System Prompts &rarr;</a>
  <button onclick="addRandomEntity()">+ Add Random Entity</button>
  <button onclick="toggleConfigPanel()">+ Add Configured Entity</button>
  <button onclick="resetSimulation()" style="color: #f00; border-color: #500;">Reset Simulation</button>
</div>

<div id="config-panel" class="config-panel">
  <div style="display:flex; gap:20px;">
    <div>
      <label>Provider:
        <select id="cfg_provider" onchange="updateCfgModelOptions()" style="background:#000; color:#0f0; border:1px solid #333; padding:4px;">
          <option value="">(Random)</option>
        </select>
      </label><br>
      <label>Model:
        <select id="cfg_model" style="background:#000; color:#0f0; border:1px solid #333; padding:4px;">
          <option value="">(Random)</option>
        </select>
      </label><br>
      <label>System Prompt:
        <select id="cfg_prompt" style="background:#000; color:#0f0; border:1px solid #333; padding:4px;">
          <option value="">(Random)</option>
        </select>
      </label><br>
      <label>Neuron Profile:
        <select id="cfg_profile" style="background:#000; color:#0f0; border:1px solid #333; padding:4px;">
          <option value="">(Random / Default)</option>
        </select>
      </label><br>
    </div>
    <div>
      <label>Brain Size: <input type="number" id="cfg_brain" placeholder="e.g. 5.0" step="0.1"></label><br>
      <label>Lifespan: <input type="number" id="cfg_life" placeholder="e.g. 100.0" step="1"></label><br>
      <label>Think Interval: <input type="number" id="cfg_think" placeholder="e.g. 5.0" step="1"></label><br>
      <label>Reproduction Threshold: <input type="number" id="cfg_repro" placeholder="e.g. 50.0" step="1"></label><br>
    </div>
    <div style="border-left: 1px solid #333; padding-left: 20px;">
      <label>Available Neurons in Pool:</label>
      <ul id="cfg_neurons_list" style="font-size: 0.8rem; color: #888; margin-top: 5px; padding-left: 20px;"></ul>
    </div>
  </div>
  <button onclick="submitConfiguredEntity()" style="margin-top:10px;">Spawn Entity</button>
</div>

<div class="layout">
  <div class="main-content">
    <h1>AGI Entity Simulation</h1>
    <div>Tick: <span id="tick">—</span></div>
    <div>Entities alive: <span id="count">—</span></div>
    <table>
      <thead>
        <tr><th>ID</th><th>Age</th><th>X</th><th>Y</th><th>Provider</th><th>Model</th></tr>
      </thead>
      <tbody id="entities"></tbody>
    </table>

    <div class="log-panel">
      <div class="log-header">
        <h2>Global Interaction Log</h2>
        <div class="log-controls">
          <input type="text" id="log-filter" placeholder="Filter by ID/Msg..." title="Filter interactions">
          <button id="pause-log-btn" onclick="toggleLogPause()">Pause</button>
          <button onclick="clearLog()">Clear</button>
        </div>
      </div>
      <div class="log-body" id="interaction-log" aria-live="polite">
        <div class="log-entry"><span class="msg">Waiting for interactions...</span></div>
      </div>
    </div>
  </div>
  <div class="side-panel" id="side-panel">
    <h2>Entity Details</h2>
    <button onclick="closeSidePanel()" style="margin-bottom: 15px;">Close Panel</button>
    <button id="destroy-btn" style="color: #f00; border-color: #500; margin-bottom: 15px; margin-left: 10px; display: none;">Destroy Entity</button>
    
    <div id="side-panel-content">
        Select an entity to view details.
    </div>
  </div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────
let logPaused = false;
let lastInteractionId = null;
let currentLogFilter = "";
let allInteractions = [];

document.getElementById('log-filter').addEventListener('input', (e) => {
    currentLogFilter = e.target.value.toLowerCase().trim();
    renderLog();
});

// ── Actions ────────────────────────────────────────────────────────

const API_BASE = "http://localhost:8000";

async function resetSimulation() {
  if (!confirm("WARNING: This will destroy all living entities, wipe the history, and reset the simulation to tick 0.")) return;
  if (!confirm("Are you absolutely sure you want to completely wipe the simulation state?")) return;

  try {
    const res = await fetch(`${API_BASE}/simulation/reset`, { method: "POST" });
    if (!res.ok) throw new Error(await res.text());
    alert("Simulation reset signal sent.");
    clearLog();
    refresh();
  } catch(e) {
    alert("Failed to reset: " + e.message);
  }
}

function toggleLogPause() {
    logPaused = !logPaused;
    const btn = document.getElementById('pause-log-btn');
    btn.textContent = logPaused ? "Resume" : "Pause";
    btn.classList.toggle('active', logPaused);
}

function clearLog() {
    allInteractions = [];
    lastInteractionId = null;
    renderLog();
}

async function pollInteractions() {
    if (logPaused) return;
    try {
        const res = await fetch(`${API_BASE}/simulation/interactions?count=50`);
        if (!res.ok) return;
        const data = await res.json();
        
        if (data.length === 0) return;

        // data is from Redis XREVRANGE, so it's newest to oldest. 
        // We want to detect new ones since lastInteractionId.
        const newOnes = [];
        if (lastInteractionId === null) {
            newOnes.push(...data);
        } else {
            for (const item of data) {
                if (item.id === lastInteractionId) break;
                newOnes.push(item);
            }
        }
        
        if (newOnes.length > 0) {
            // Prepend new ones to our internal list (since data is newest first)
            allInteractions = [...newOnes, ...allInteractions].slice(0, 200);
            lastInteractionId = data[0].id;
            renderLog();
        }
    } catch(e) {
        console.error("Failed to poll interactions", e);
    }
}

function renderLog() {
    const logBody = document.getElementById('interaction-log');
    logBody.innerHTML = '';
    
    const filtered = currentLogFilter 
        ? allInteractions.filter(i => 
            i.source_id.toLowerCase().includes(currentLogFilter) || 
            i.message.toLowerCase().includes(currentLogFilter) ||
            i.type.toLowerCase().includes(currentLogFilter)
          )
        : allInteractions;

    if (filtered.length === 0) {
        logBody.innerHTML = '<div class="log-entry"><span class="msg">No matching interactions...</span></div>';
        return;
    }

    // allInteractions is newest-first. We append them.
    filtered.forEach(i => {
        const entry = document.createElement('div');
        entry.className = `log-entry ${i.type}`;
        
        // Extract timestamp from Redis ID (e.g. 1713212345678-0)
        const timestamp = i.id.split('-')[0];
        const date = new Date(parseInt(timestamp));
        const timeStr = date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});

        entry.innerHTML = `
            <span class="time">[${timeStr}]</span>
            <span class="type">${i.type.toUpperCase()}</span>
            <span class="source" onclick="setLogFilter('${i.source_id}')">${i.source_id}</span>
            <span class="msg">${i.message}</span>
        `;
        logBody.appendChild(entry);
    });
}

function setLogFilter(id) {
    const filterInput = document.getElementById('log-filter');
    filterInput.value = id;
    currentLogFilter = id.toLowerCase();
    renderLog();
}

function toggleConfigPanel() {
  const p = document.getElementById("config-panel");
  p.style.display = p.style.display === "block" ? "none" : "block";
  if (p.style.display === "block") {
    loadConfigOptions();
  }
}

let loadedSettings = {};

async function loadConfigOptions() {
  try {
    const sRes = await fetch(`${API_BASE}/settings/`);
    if (sRes.ok) loadedSettings.global = await sRes.json();

    for (const prov of loadedSettings.global.allowed_providers || []) {
      const pRes = await fetch(`${API_BASE}/${prov}/settings`);
      if (pRes.ok) {
        const d = await pRes.json();
        const allowedRaw = d[`${prov}_allowed_models`];
        let allowed = [];
        if (Array.isArray(allowedRaw)) allowed = allowedRaw;
        else if (allowedRaw && allowedRaw.text && Array.isArray(allowedRaw.text)) allowed = allowedRaw.text;
        loadedSettings[prov] = allowed;
      }
    }

    const pSel = document.getElementById('cfg_provider');
    pSel.innerHTML = '<option value="">(Random)</option>';
    (loadedSettings.global.allowed_providers || []).forEach(p => {
      pSel.innerHTML += `<option value="${p}">${p}</option>`;
    });

    const spRes = await fetch(`${API_BASE}/system-prompts/`);
    if (spRes.ok) {
      const prompts = await spRes.json();
      const spSel = document.getElementById('cfg_prompt');
      spSel.innerHTML = '<option value="">(Random)</option>';
      prompts.forEach(p => {
        spSel.innerHTML += `<option value="${p.content}">${p.name}</option>`;
      });
    }

    const nRes = await fetch(`${API_BASE}/neurons/`);
    if (nRes.ok) {
      const neurons = await nRes.json();
      const nList = document.getElementById('cfg_neurons_list');
      nList.innerHTML = '';
      neurons.forEach(n => {
        const li = document.createElement('li');
        li.textContent = `${n.name} (${n.category})`;
        nList.appendChild(li);
      });
    }

    const prRes = await fetch(`${API_BASE}/neurons/profiles`);
    if (prRes.ok) {
      const profiles = await prRes.json();
      const prSel = document.getElementById('cfg_profile');
      prSel.innerHTML = '<option value="">(Random / Default)</option>';
      profiles.forEach(p => {
        prSel.innerHTML += `<option value="${p.id}">${p.name}</option>`;
      });
    }
  } catch (e) {
    console.error("Failed to load config options", e);
  }
}

function updateCfgModelOptions() {
  const prov = document.getElementById('cfg_provider').value;
  const mSel = document.getElementById('cfg_model');
  mSel.innerHTML = '<option value="">(Random)</option>';
  if (!prov || !loadedSettings[prov]) return;
  loadedSettings[prov].forEach(m => {
    mSel.innerHTML += `<option value="${m}">${m}</option>`;
  });
}

async function addRandomEntity() {
  try {
    const res = await fetch(`${API_BASE}/entities/`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({})
    });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    console.log("Added random entity", data);
    refresh();
  } catch (e) {
    alert("Failed to add entity: " + e.message);
  }
}

async function submitConfiguredEntity() {
  const payload = {};
  const vBrain = document.getElementById('cfg_brain').value;
  const vLife = document.getElementById('cfg_life').value;
  const vThink = document.getElementById('cfg_think').value;
  const vRepro = document.getElementById('cfg_repro').value;
  const vProv = document.getElementById('cfg_provider').value;
  const vModel = document.getElementById('cfg_model').value;
  const vPrompt = document.getElementById('cfg_prompt').value;
  const vProfile = document.getElementById('cfg_profile').value;

  if (vBrain) payload.brain_size = parseFloat(vBrain);
  if (vLife) payload.lifespan = parseFloat(vLife);
  if (vThink) payload.think_interval = parseFloat(vThink);
  if (vRepro) payload.reproduction_threshold = parseFloat(vRepro);
  if (vProv) payload.provider = vProv;
  if (vModel) payload.model = vModel;
  if (vPrompt) payload.system_prompt = vPrompt;
  if (vProfile) payload.neuron_profile = vProfile;

  try {
    const res = await fetch(`${API_BASE}/entities/`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    console.log("Added configured entity", data);
    document.getElementById("config-panel").style.display = "none";
    refresh();
  } catch(e) {
    alert("Failed to add configured entity: " + e.message);
  }
}

function closeSidePanel() {
  document.getElementById("side-panel").style.display = "none";
}

async function loadEntityDetails(id) {
  const panel = document.getElementById("side-panel");
  const content = document.getElementById("side-panel-content");
  const destroyBtn = document.getElementById("destroy-btn");
  panel.style.display = "block";
  content.innerHTML = "Loading...";
  destroyBtn.style.display = "none";

  try {
    const res = await fetch(`${API_BASE}/entities/${encodeURIComponent(id)}`);
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();

    content.innerHTML = `
        <div class="detail-block"><strong>ID</strong><span>${data.id}</span></div>
        <div class="detail-block"><strong>Status</strong><span>${data.alive === "True" ? "Alive" : "Dead"}</span></div>
        <div class="detail-block"><strong>Age</strong><span>${data.age}</span></div>
        <div class="detail-block"><strong>Position</strong><span>X: ${parseFloat(data.position_x).toFixed(1)} Y: ${parseFloat(data.position_y).toFixed(1)}</span></div>
        <div class="detail-block"><strong>Provider / Model</strong><span>${data.provider} / ${data.model}</span></div>
        
        <div class="tabs">
            <button id="btn-tab-prompts" class="tab-btn active" onclick="showTab('tab-prompts')">Prompts</button>
            <button id="btn-tab-neural" class="tab-btn" onclick="showTab('tab-neural')">Neural</button>
            <button id="btn-tab-exchange" class="tab-btn" onclick="showTab('tab-exchange')">Exchange</button>
            <button id="btn-tab-genetics" class="tab-btn" onclick="showTab('tab-genetics')">Genetics</button>
        </div>

        <div id="tab-prompts" class="tab-content active">
            <div class="detail-block"><strong>System Prompt</strong><pre>${data.system_prompt}</pre></div>
            <div class="detail-block">
                <strong>User Prompt (Reflection)</strong>
                <textarea id="edit_user_prompt">${data.user_prompt}</textarea>
                <button class="save-btn" onclick="saveUserPrompt('${data.id}')">Save User Prompt</button>
            </div>
        </div>

        <div id="tab-neural" class="tab-content">
            <div class="detail-block"><strong>Capability Manifest</strong><pre id="neural-manifest">Loading...</pre></div>
            <div class="detail-block"><strong>Neuron Activations</strong><pre id="neural-activations">Loading...</pre></div>
        </div>

        <div id="tab-exchange" class="tab-content">
            <div class="detail-block"><strong>Last LLM Exchange</strong><pre id="llm-exchange">Loading...</pre></div>
        </div>

        <div id="tab-genetics" class="tab-content">
            <div class="detail-block"><strong>Genome</strong><pre id="genome-view">Loading...</pre></div>
        </div>
    `;

    // Fill detailed views
    try {
        document.getElementById('genome-view').textContent = JSON.stringify(JSON.parse(data.genome), null, 2);
    } catch(e) { document.getElementById('genome-view').textContent = data.genome; }

    if (data.last_manifest) {
        try {
            document.getElementById('neural-manifest').textContent = JSON.stringify(JSON.parse(data.last_manifest), null, 2);
        } catch(e) { document.getElementById('neural-manifest').textContent = data.last_manifest; }
    } else {
        document.getElementById('neural-manifest').textContent = "No manifest data yet.";
    }

    if (data.last_activations) {
        try {
            const acts = JSON.parse(data.last_activations);
            document.getElementById('neural-activations').textContent = acts.map(a => a.toFixed(3)).join(", ");
        } catch(e) { document.getElementById('neural-activations').textContent = data.last_activations; }
    } else {
        document.getElementById('neural-activations').textContent = "No activation data yet.";
    }

    if (data.last_llm_exchange) {
        try {
            document.getElementById('llm-exchange').textContent = JSON.stringify(JSON.parse(data.last_llm_exchange), null, 2);
        } catch(e) { document.getElementById('llm-exchange').textContent = data.last_llm_exchange; }
    } else {
        document.getElementById('llm-exchange').textContent = "No LLM exchange data yet.";
    }

    // Show destroy button
    destroyBtn.style.display = "inline-block";
    destroyBtn.onclick = () => destroyEntity(data.id);
  } catch (e) {
    content.textContent = "Failed to load details: " + e.message;
  }
}

function showTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    
    document.getElementById(tabId).classList.add('active');
    document.getElementById('btn-' + tabId).classList.add('active');
}

async function destroyEntity(id) {
  if (!confirm(`WARNING: You are about to destroy entity ${id}. This cannot be undone.`)) return;
  if (!confirm(`Are you absolutely sure you want to permanently destroy entity ${id}?`)) return;

  try {
    const res = await fetch(`${API_BASE}/entities/${encodeURIComponent(id)}`, { method: "DELETE" });
    if (!res.ok) throw new Error(await res.text());
    alert("Entity destroyed.");
    closeSidePanel();
    refresh();
  } catch (e) {
    alert("Failed to destroy entity: " + e.message);
  }
}

async function saveUserPrompt(id) {
  const newUserPrompt = document.getElementById('edit_user_prompt').value;
  try {
    const res = await fetch(`${API_BASE}/entities/${encodeURIComponent(id)}/user_prompt`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_prompt: newUserPrompt })
    });
    if (!res.ok) throw new Error(await res.text());
    alert("User prompt updated successfully.");
  } catch (e) {
    alert("Failed to update user prompt: " + e.message);
  }
}

// ── Data Refresh ───────────────────────────────────────────────────
async function refresh() {
  try {
    const r = await fetch('/api/state');
    if (!r.ok) return; // Skip update if not ready
    const d = await r.json();
    document.getElementById('tick').textContent = d.tick;
    document.getElementById('count').textContent = d.entities.length;
    const tbody = document.getElementById('entities');
    tbody.innerHTML = '';
    d.entities.forEach(e => {
      const tr = document.createElement('tr');
      tr.onclick = () => loadEntityDetails(e.id);
      [
        e.id,
        e.age,
        parseFloat(e.position_x).toFixed(1),
        parseFloat(e.position_y).toFixed(1),
        e.provider,
        e.model
      ].forEach(text => {
        const td = document.createElement('td');
        td.textContent = text;
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  } catch (e) {
    console.error("Failed to fetch state:", e);
  }
}

// ── Startup ────────────────────────────────────────────────────────
refresh();
pollInteractions();
setInterval(refresh, 2000);
setInterval(pollInteractions, 3000);
</script>
</body>
</html>
