[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "c2"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "quart>=0.20",
    "hypercorn>=0.17",
    "redis[hiredis]>=5.2",
    "pydantic>=2.10",
    "anthropic>=0.49",
    "openai>=1.68",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "fakeredis>=2.26",
    "respx>=0.22",
    "pytest-cov>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["genetics", "neural", "agents", "environment", "simulation", "storage", "api", "web"]
